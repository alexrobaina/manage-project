version: '3.8'

services:
  db:
    image: postgres:16
    container_name: pm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: presentation_manager
    volumes:
      - pm_pgdata:/var/lib/postgresql/data

volumes:
  pm_pgdata:
